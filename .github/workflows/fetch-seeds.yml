# Télécharge les jeux de données ouverts et les range dans data/seeds/history (à la demande).
name: Fetch seeds
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pycountry
      - run: python scripts/fetch_seeds.py
      - run: |
          git config user.name "seed-bot"
          git config user.email "seed-bot@users.noreply.github.com"
          git add data/seeds/history
          git commit -m "Seeds : histoire, démographie, politique, conflits, Nobel" || echo "Rien de nouveau"
          git push
