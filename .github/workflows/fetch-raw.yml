# Télécharge des fichiers bruts (nom=url) dans data/seeds/raw, pour inspection et construction de séries.
name: Fetch raw
on:
  workflow_dispatch:
    inputs:
      items: {description: "nom=url séparés par des espaces", required: true}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {ITEMS: "${{ inputs.items }}"}
        run: |
          mkdir -p data/seeds/raw
          for it in $ITEMS; do
            n="${it%%=*}"; u="${it#*=}"
            curl -sSL --max-time 300 -A "Mozilla/5.0 (X11; Linux x86_64) statlas-seeds" -o "data/seeds/raw/$n" "$u" && ls -la "data/seeds/raw/$n" || echo "ECHEC $n"
          done
      - run: |
          git config user.name "seed-bot"
          git config user.email "seed-bot@users.noreply.github.com"
          git add data/seeds/raw
          git commit -m "Seeds : fichiers bruts" || echo "Rien de nouveau"
          git pull --rebase -X theirs && git push
